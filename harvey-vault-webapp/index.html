<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Vault — Harvey</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>

<div class="app-shell">

  <aside class="sidebar">
    <button class="org-switcher">
      <span class="org-mark">W</span>
      <span class="org-name">Whitford Lane</span>
      <svg class="chev" width="10" height="10" viewBox="0 0 10 10" fill="none"><path d="M2 3.5L5 6.5L8 3.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <button class="btn-create">
      <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><path d="M7 2V12M2 7H12" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
      Create
    </button>

    <nav class="nav-list">
      <a class="nav-item" href="#">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3h10v7H6l-3 3V3Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Assistant
      </a>

      <div class="nav-item nav-item--active nav-item--expanded">
        <a href="#" class="nav-item-row">
          <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M2 5a2 2 0 0 1 2-2h2.5l1.5 1.5H12a2 2 0 0 1 2 2v5.5a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
          Vault
        </a>
        <div class="nav-sub">
          <a href="#" class="nav-sub-item">Statements (A&amp;W)</a>
          <a href="#" class="nav-sub-item">Delta Supply</a>
          <a href="#" class="nav-sub-item">Supply Agreements</a>
        </div>
      </div>

      <a class="nav-item" href="#">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="4" cy="4" r="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="12" cy="8" r="1.6" stroke="currentColor" stroke-width="1.3"/><circle cx="4" cy="12" r="1.6" stroke="currentColor" stroke-width="1.3"/><path d="M5.4 4.7L10.6 7.4M10.6 8.6L5.4 11.3" stroke="currentColor" stroke-width="1.2"/></svg>
        Workflows
      </a>

      <a class="nav-item" href="#">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><circle cx="8" cy="8" r="5.8" stroke="currentColor" stroke-width="1.3"/><path d="M8 5v3.2l2.2 1.3" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        History
      </a>

      <a class="nav-item" href="#">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 3.5c1.6-1 3.4-1 5 0v9c-1.6-1-3.4-1-5 0v-9Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/><path d="M13 3.5c-1.6-1-3.4-1-5 0v9c1.6-1 3.4-1 5 0v-9Z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg>
        Library
      </a>

      <a class="nav-item" href="#">
        <svg class="nav-icon" width="16" height="16" viewBox="0 0 16 16" fill="none"><rect x="3" y="2.5" width="10" height="11" rx="1.3" stroke="currentColor" stroke-width="1.3"/><path d="M5.5 6.5l1.7 1.7L10.5 5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"/></svg>
        Guidance
      </a>
    </nav>

    <a class="nav-help" href="#">
      <svg width="15" height="15" viewBox="0 0 15 15" fill="none"><circle cx="7.5" cy="7.5" r="6" stroke="currentColor" stroke-width="1.2"/><path d="M5.8 5.8a1.7 1.7 0 0 1 3.3.5c0 1.1-1.6 1.2-1.6 2.3" stroke="currentColor" stroke-width="1.1" stroke-linecap="round"/><circle cx="7.5" cy="10.6" r="0.5" fill="currentColor"/></svg>
      Help
    </a>
  </aside>

  <main class="content">
    <header class="page-header">
      <h1>Vault</h1>
      <p>Upload, store, and analyze thousands of documents</p>
    </header>

    <div class="entry-cards">
      <button class="entry-card">
        <span class="entry-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><path d="M3 6a2 2 0 0 1 2-2h3l2 2h5a2 2 0 0 1 2 2v6.5a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6Z" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
        </span>
        <span class="entry-copy">
          <span class="entry-title">Create project</span>
          <span class="entry-desc">Upload a new collection of files or folders.</span>
        </span>
      </button>

      <button class="entry-card">
        <span class="entry-icon">
          <svg width="20" height="20" viewBox="0 0 20 20" fill="none"><circle cx="8.3" cy="8.3" r="4.3" stroke="currentColor" stroke-width="1.4"/><path d="M11.5 11.5L15.5 15.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </span>
        <span class="entry-copy">
          <span class="entry-title">Create knowledge base</span>
          <span class="entry-desc">Distribute a repository of files to your organization.</span>
        </span>
      </button>
    </div>

    <div class="toolbar">
      <div class="page-tabs" id="pageTabs">
        <button class="tab tab--active" data-filter="all">All projects</button>
        <button class="tab" data-filter="yours">Your Projects</button>
        <button class="tab" data-filter="shared">Shared with you</button>
      </div>
      <div class="search-input">
        <svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="6" cy="6" r="4.2" stroke="currentColor" stroke-width="1.3"/><path d="M9.2 9.2L12.5 12.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
        <input id="searchBox" type="text" placeholder="Search" />
      </div>
    </div>

    <div class="project-grid" id="projectGrid"></div>
  </main>

</div>

<script src="app.js"></script>
</body>
</html>
