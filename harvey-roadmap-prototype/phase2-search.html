<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Cross-Matter Search — Phase 2 Concept</title>
<link rel="stylesheet" href="shared.css" />
<style>
  .hero-search { display: flex; align-items: center; gap: 10px; border: 1px solid var(--hairline); border-radius: var(--hero-radius); padding: 14px 18px; max-width: 760px; margin-bottom: 6px; }
  .hero-search input { flex: 1; border: none; outline: none; font-size: 15px; background: none; color: var(--ink); }
  .hero-search input::placeholder { color: var(--muted); }
  .kbd-hint { font-size: 11px; color: var(--muted); border: 1px solid var(--hairline); border-radius: 5px; padding: 2px 6px; }
  .search-scope { font-size: 12.5px; color: var(--muted); margin: 8px 0 24px; }

  .split { display: flex; gap: 28px; align-items: flex-start; }
  .results-col { width: 320px; flex-shrink: 0; display: flex; flex-direction: column; gap: 10px; }
  .result-card { border: 1px solid var(--hairline); border-radius: var(--card-radius); padding: 13px 14px; cursor: pointer; }
  .result-card.active { border-color: var(--ink); background: var(--nav-active-bg); }
  .result-card .rc-title { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
  .result-card .rc-meta { font-size: 11.5px; color: var(--muted); }
  .result-card .rc-prior { display: inline-block; margin-top: 6px; font-size: 10.5px; font-weight: 700; letter-spacing: .03em; color: var(--accent); background: var(--new-badge-bg); border-radius: 999px; padding: 2px 7px; }

  .review-col { flex: 1; }
  .review-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
  .review-title { font-size: 16px; font-weight: 700; }
  .review-body { border: 1px solid var(--hairline); border-radius: var(--hero-radius); padding: 26px 30px; }
  .review-body p { color: var(--body); font-size: 14px; line-height: 1.7; margin-bottom: 12px; }

  .trace-list { margin-top: 18px; display: flex; flex-direction: column; gap: 10px; }
  .trace-item { display: flex; align-items: flex-start; gap: 10px; border-top: 1px solid var(--hairline); padding-top: 10px; font-size: 13px; }
  .trace-item .ti-icon { color: var(--progress-done); flex-shrink: 0; margin-top: 1px; }
  .trace-item .ti-source { color: var(--muted); font-size: 12px; }
  .trace-item .ti-comment { margin-top: 4px; font-size: 12px; color: var(--body); background: var(--badge-bg); border-radius: 6px; padding: 6px 8px; }

  .review-composer { margin-top: 18px; }
</style>
</head>
<body>

<div class="app-shell">
  <div id="sidebar-root"></div>

  <main class="content">
    <div class="page-header">
      <p class="crumb">Roadmap / Phase 2 · <strong>Cross-Matter Search + Partner Review</strong></p>
      <h1>Cross-Matter Search</h1>
      <p>Search the firm's own captured work product — permission-scoped — then hand any result to a partner to trace, verify, and comment.</p>
    </div>

    <div class="hero-search">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" style="color:var(--muted); flex-shrink:0;"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.3 10.3L13.5 13.5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
      <input value="Have we taken a position on change-of-control for a pharma client?" />
      <span class="kbd-hint">⌘K</span>
    </div>
    <p class="search-scope">Scoped to matters you have access to · 3 results · 340ms</p>

    <div class="split">
      <div class="results-col" id="resultsCol"></div>

      <div class="review-col" id="reviewCol"></div>
    </div>
  </main>
</div>

<script src="shell.js"></script>
<script src="phase2.js"></script>
</body>
</html>
